name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      REGISTRY_TEST_DATABASE_URL: postgres://registry:registry@localhost:5432/registry_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (with Postgres)
        run: go test -count=1 -race ./...
      - name: build
        run: go build ./cmd/openlinker-registry
      # The release workflow packages with this script; keep it working.
      - name: package (release path smoke)
        run: |
          archive="$(bash ./scripts/package-release.sh ci "${GITHUB_SHA}" linux amd64 "${RUNNER_TEMP}/dist")"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/openlinker-registry-ci-linux-amd64/openlinker-registry" version | grep -Fx "openlinker-registry ci (${GITHUB_SHA})"
